name: Build Lark Liquid Glass iOS 26 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile & Package Liquid Glass APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Normalize Project Directory Structure
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ -f "LarkLiquidGlassPlayer/settings.gradle.kts" ]; then
            echo "Detected nested LarkLiquidGlassPlayer folder, moving files to repository root..."
            shopt -s dotglob
            mv LarkLiquidGlassPlayer/* .
            rmdir LarkLiquidGlassPlayer || true
          fi
          ls -la

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build Debug & Signed Store Release APKs
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare Output APKs for Download
        run: |
          mkdir -p output-apks
          cp app/build/outputs/apk/debug/app-debug.apk output-apks/LarkLiquidGlass-iOS26-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk output-apks/LarkLiquidGlass-iOS26-Release.apk
          ls -lh output-apks/

      - name: Upload Ready-to-Install APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LarkLiquidGlass-iOS26-Player-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Automatic GitHub Release (on main/master push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Lark Liquid Glass Player (iOS 26 Production Release) #${{ github.run_number }}"
          body: |
            ### 💧 Lark Liquid Glass Video Player — iOS 26 Store Production Release
            - **Real SDF Optical Lens Refraction & Chromatic Dispersion** powered by hardware `GraphicsLayer` and custom Android 13+ AGSL `RuntimeShader`.
            - **Interactive Fluid Droplet Physics**: Buttons lift upward (`translationY`), expand with spring physics, and smoothly follow your finger (`tanh` magnetic drag).
            - **Main Library Refractive Scrolling**: Video thumbnails refract through the floating top search bar, category pills, mini-player, and bottom navigation bar as you scroll.
            - **Hardware-Accelerated Media3 (ExoPlayer) + 200% Volume Booster, 5-Band Equalizer, A-B Repeat, Sleep Timer & Private Vault**.
          files: |
            output-apks/LarkLiquidGlass-iOS26-Release.apk
            output-apks/LarkLiquidGlass-iOS26-Debug.apk
          prerelease: false

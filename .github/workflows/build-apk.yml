name: Build EG Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile & Package Single EG Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Normalize Project Directory Structure
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            for dir in EGPlayer LarkLiquidGlassPlayer */; do
              if [ -f "${dir}/settings.gradle.kts" ]; then
                echo "Moving project files from ${dir} to repository root..."
                shopt -s dotglob
                mv "${dir}"/* .
                rmdir "${dir}" || true
                break
              fi
            done
          fi
          ls -la

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build Signed Store Release APK (Single Unified APK)
        run: |
          gradle assembleRelease -PenableNativeCmake=true --stacktrace || gradle assembleRelease --stacktrace

      - name: Prepare Single Output APK (EGPlayer.apk)
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/EGPlayer.apk
          ls -lh output-apk/

      - name: Upload Single Ready-to-Install EGPlayer.apk to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EGPlayer-APK
          path: output-apk/EGPlayer.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Automatic GitHub Release (Single APK)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: "EG Player Official Release #${{ github.run_number }}"
          body: |
            ### EG Player — Official Store Release
            - Single ready-to-install `EGPlayer.apk` package.
            - Authentic Liquid Glass bottom navigation bar and top search bar (`com.kyant.backdrop`).
            - Automatic phone language detection (`RTL` & `LTR`), real device video frame thumbnails, and full iOS Media3 video player with Previous/Next buttons, Auto-Play Next, 10s skip, and animated vector 2.0x speed indicator.
          files: |
            output-apk/EGPlayer.apk
          prerelease: false
